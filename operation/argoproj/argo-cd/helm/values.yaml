#     annotations:
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
      # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # extraTls:
    #   - hosts:
    #     - argocd.club012.com
    #     # Based on the ingress controller used secret might be optional
    #     secretName: argocd-tls

server:
  ingress:
    enabled: true
    ingressClassName: traefik  # 1. Traefik 인그레스 클래스 지정
    annotations:
      # 2. SSL 강제 리다이렉트 해제 (Nginx의 force-ssl-redirect: "false" 매핑)
      # Traefik은 진입점(Entrypoint) 단위로 HTTPS 전환을 제어하지만, 
      # 인그레스 레벨에서 명시적으로 스키마를 고정하려면 아래 설정을 사용합니다.
      traefik.ingress.kubernetes.io/router.entrypoints: web
      
      # 3. 백엔드 프로토콜 HTTP 설정 (Nginx의 backend-protocol: "HTTP" 매핑)
      # Traefik은 기본적으로 백엔드 서비스의 포트 이름을 보고 프로토콜을 추론합니다.
      # ArgoCD server 서비스의 HTTP 포트(기본 명칭: http 또는 server)를 강제 지정합니다.
      traefik.ingress.kubernetes.io/service.server-status-port: "http"