# kubectl apply -n argocd -f argocd-image-updater-cronjob.yaml
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-image-updater-cronjob
  # namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-job
spec:
  # 💡 2월 31일 0시 0분 -> 달력에 없는 날짜이므로 스케줄러에 의해 자동 실행되지 않음
  schedule: "0 0 31 12 *"
  # 중복 실행 방지
  concurrencyPolicy: Forbid
  # 히스토리 관리 (성공 3개, 실패 1개 보관)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # 작업 실패 시 재시도 횟수
      backoffLimit: 1
      # 성공 완료 후 100초 뒤 Job Pod 자동 정리 (K8s 1.21+)
      ttlSecondsAfterFinished: 100
      template:
        metadata:
          labels:
            app.kubernetes.io/name: argocd-image-updater-job
        spec:
          # Argo CD Image Updater 서비스 계정 사용 (CRD 및 App 조회 권한)
          serviceAccountName: argocd-image-updater
          restartPolicy: Never
          containers:
            - name: argocd-image-updater
              image: quay.io/argoprojlabs/argocd-image-updater:v1.2.2 # 또는 사용 중이신 이미지 태그
              command:
                - /manager
              args:
                - run
                - --once
                - --leader-election=false
              env:
                # 💡 컨트롤러가 실행되는 namespace를 명시하여 Leader Election 오류 방지
                - name: ARGOCD_IMAGE_UPDATER_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - mountPath: /app/config
                  name: image-updater-conf
          volumes:
            - configMap:
                items:
                  - key: registries.conf
                    path: registries.conf
                  - key: git.commit-message-template
                    path: commit.template
                name: argocd-image-updater-config
                optional: true
              name: image-updater-conf
