# kubectl apply -n argocd -f argocd-image-updater-job.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-image-updater-job
  # namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-job
spec:
  # 작업 실패 시 재시도 횟수
  backoffLimit: 1
  # 성공 완료 후 100초 뒤 Job 리소스 자동 정리 (K8s 1.21+)
  ttlSecondsAfterFinished: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater-job
    spec:
      # Argo CD Image Updater 서비스 계정 사용 (CRD 및 App 조회 권한)
      serviceAccountName: argocd-image-updater
      restartPolicy: Never
      containers:
        - name: argocd-image-updater
          image: quay.io/argoprojlabs/argocd-image-updater:v1.2.2 # 또는 사용 중이신 1.x.x 이미지 태그
          command:
            - /manager
          args:
            - run
            - --once
            - --leader-election=false
          env:
            # 💡 컨트롤러가 실행되는 namespace를 명시하여 Leader Election 오류 방지
            - name: ARGOCD_IMAGE_UPDATER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace